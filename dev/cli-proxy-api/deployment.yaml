apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-proxy-api
  namespace: cli-proxy-api
  labels:
    app: cli-proxy-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cli-proxy-api
  template:
    metadata:
      labels:
        app: cli-proxy-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: mikefarah/yq:4.53.6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              mkdir -p /data/auths
              src=/seed/config.yaml
              if [ -f /data/config.yaml ]; then
                src="/data/config.yaml /seed/config.yaml"
              fi
              yq eval-all '. as $item ireduce ({}; . * $item)' $src > /data/config.yaml.tmp
              mv /data/config.yaml.tmp /data/config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "64Mi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: cli-proxy-api
          image: ghcr.io/mtaku3/cli-proxy-api:v8.0.3-6fa9b170
          imagePullPolicy: IfNotPresent
          command:
            - /CLIProxyAPI/CLIProxyAPI
          args:
            - -config
            - /data/config.yaml
          ports:
            - name: http
              containerPort: 8317
          env:
            - name: HOME
              value: /tmp
            - name: TZ
              value: Asia/Tokyo
            - name: WRITABLE_PATH
              value: /data
            - name: REQUIRE_API_KEY
              value: "true"
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cli-proxy-api-management
                  key: MANAGEMENT_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cli-proxy-api-data
        - name: seed
          configMap:
            name: cli-proxy-api-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
