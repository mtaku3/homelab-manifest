apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web
  namespace: cli-proxy-api
  annotations:
    external-dns.alpha.kubernetes.io/target: 202.215.58.76
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        Host(`cliproxy.mtaku3.com`) && (
        Path(`/v1/models`) ||
        Path(`/v1/chat/completions`) ||
        Path(`/v1/completions`) ||
        Path(`/v1/messages`) ||
        Path(`/v1/messages/count_tokens`) ||
        Path(`/v1/responses`) ||
        Path(`/v1/responses/compact`) ||
        Path(`/v1beta/models`) ||
        PathPrefix(`/v1beta/models/`))
      kind: Rule
      priority: 100
      services:
        - name: cli-proxy-api
          port: http
    - match: Host(`cliproxy.mtaku3.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: tinyauth
          namespace: traefik
      services:
        - name: cli-proxy-api
          port: http
  tls:
    secretName: web-tls-cert
