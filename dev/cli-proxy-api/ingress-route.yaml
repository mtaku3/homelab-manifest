apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web
  namespace: cli-proxy-api
  annotations:
    external-dns.alpha.kubernetes.io/target: 202.215.58.76
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        Host(`cliproxy.mtaku3.com`) && (
        PathPrefix(`/v1/`) ||
        PathPrefix(`/v1beta/`) ||
        PathPrefix(`/openai/v1/`) ||
        PathPrefix(`/backend-api/codex/`)) &&
        !PathPrefix(`/v1/ws`)
      kind: Rule
      priority: 100
      services:
        - name: cli-proxy-api
          port: http
    - match: Host(`cliproxy.mtaku3.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: tinyauth
          namespace: traefik
      services:
        - name: cli-proxy-api
          port: http
  tls:
    secretName: web-tls-cert
