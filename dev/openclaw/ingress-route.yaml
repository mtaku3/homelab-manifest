apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openclaw
  namespace: openclaw
  annotations:
    external-dns.alpha.kubernetes.io/target: 202.215.58.76
spec:
  entryPoints:
    - websecure
  routes:
    # No forward auth: the gateway authenticates clients itself with a shared
    # token, and reaching the Control UI additionally takes a device approval on
    # helios. Trusted-proxy auth would have let tinyauth stand in for the token,
    # but the Android app cannot present proxy identity headers.
    - match: Host(`openclaw.mtaku3.com`)
      kind: Rule
      services:
        - name: openclaw
          port: http
  tls:
    secretName: openclaw-tls-cert
