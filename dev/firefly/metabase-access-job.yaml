apiVersion: batch/v1
kind: Job
metadata:
  name: firefly-metabase-access
  namespace: firefly
  annotations:
    # Apply the metabase_ro role and its column grants (metabase-access.sql)
    # after every sync.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: docker.io/postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          command:
            - sh
            - -c
            - >-
              psql -h firefly-iii-postgres -U firefly -d firefly
              -v ro_password="$METABASE_RO_PASSWORD" -f /sql/metabase-access.sql
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-iii-runtime
                  key: DB_PASSWORD
            - name: METABASE_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-metabase-ro
                  key: METABASE_RO_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: firefly-metabase-access-sql
