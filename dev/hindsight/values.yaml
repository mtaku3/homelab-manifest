fullnameOverride: hindsight
existingSecret: hindsight-runtime

api:
  replicaCount: 1
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 8Gi
  persistence:
    modelCache:
      enabled: true
      size: 10Gi
      storageClass: piraeus-storage
      accessModes:
        - ReadWriteOnce
  env:
    HINDSIGHT_API_LLM_PROVIDER: openrouter
    HINDSIGHT_API_LLM_MODEL: openai/gpt-oss-20b:nitro
    HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: English
    HINDSIGHT_API_EMBEDDINGS_PROVIDER: local
    HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: BAAI/bge-m3
    HINDSIGHT_API_RERANKER_PROVIDER: local
    HINDSIGHT_API_RERANKER_LOCAL_MODEL: BAAI/bge-reranker-v2-m3
    HINDSIGHT_API_RERANKER_LOCAL_MAX_CONCURRENT: "1"
    HINDSIGHT_API_RERANKER_LOCAL_BUCKET_BATCHING: "true"
    HINDSIGHT_API_VECTOR_EXTENSION: pgvector
    HINDSIGHT_API_TEXT_SEARCH_EXTENSION: pgroonga
    HINDSIGHT_API_WORKER_ID: hindsight
    HINDSIGHT_API_WORKER_MAX_SLOTS: "4"
    HINDSIGHT_API_WORKER_CONSOLIDATION_RESERVED_SLOTS: "1"
    HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension

worker:
  enabled: false

controlPlane:
  replicaCount: 1

postgresql:
  enabled: false
  external:
    host: hindsight-postgres
    port: 5432
    database: hindsight
    username: hindsight

ingress:
  enabled: false

autoscaling:
  enabled: false
