- op: remove
  path: /spec/template/spec/containers/0/envFrom
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: HINDSIGHT_CP_DATAPLANE_API_KEY
    valueFrom:
      secretKeyRef:
        name: hindsight-runtime
        key: HINDSIGHT_CP_DATAPLANE_API_KEY
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: HINDSIGHT_CP_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: hindsight-runtime
        key: HINDSIGHT_CP_ACCESS_KEY
