helmCharts:
  - repo: oci://ghcr.io/vectorize-io/charts
    name: hindsight
    version: "0.9.1"
    namespace: hindsight
    releaseName: hindsight
    valuesFile: values.yaml
  - repo: oci://registry-1.docker.io/cloudpirates
    name: postgres
    version: "0.19.0"
    namespace: hindsight
    releaseName: hindsight-postgres
    valuesFile: postgres-values.yaml

resources:
  - certificate.yaml
  - ingress-route.yaml
  - runtime-secret.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: hindsight-postgres
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/apiVersion
        value: v1
      - op: add
        path: /spec/volumeClaimTemplates/0/kind
        value: PersistentVolumeClaim
