- op: remove
  path: /spec/template/spec/containers/0/envFrom
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: HINDSIGHT_API_LLM_API_KEY
    valueFrom:
      secretKeyRef:
        name: hindsight-runtime
        key: HINDSIGHT_API_LLM_API_KEY
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: HINDSIGHT_API_TENANT_API_KEY
    valueFrom:
      secretKeyRef:
        name: hindsight-runtime
        key: HINDSIGHT_API_TENANT_API_KEY
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: HINDSIGHT_API_MCP_AUTH_TOKEN
    valueFrom:
      secretKeyRef:
        name: hindsight-runtime
        key: HINDSIGHT_API_MCP_AUTH_TOKEN
