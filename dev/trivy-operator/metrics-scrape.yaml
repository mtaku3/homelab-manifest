# The chart only ships a Prometheus Operator ServiceMonitor; VictoriaMetrics
# scrapes the operator's metrics through this instead. honorLabels keeps the
# scanned workload's namespace in `namespace` instead of the operator's.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: trivy-operator
  namespace: trivy-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: trivy-operator
      app.kubernetes.io/instance: trivy-operator
  endpoints:
    - port: metrics
      honorLabels: true
