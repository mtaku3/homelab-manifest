# Scans the images of running workloads for known vulnerabilities and for
# secrets baked into them. Findings are kept as VulnerabilityReport and
# ExposedSecretReport resources and exported as metrics to VictoriaMetrics.
# They are not alerted on: Alertmanager can't notify only once, so long-lived
# findings would be re-sent every few days and on every Alertmanager restart.
helmCharts:
  - repo: https://aquasecurity.github.io/helm-charts/
    name: trivy-operator
    version: "0.38.1"
    includeCRDs: true
    namespace: trivy-operator
    releaseName: trivy-operator
    valuesFile: values.yaml

resources:
  - metrics-scrape.yaml
