# Reports are recreated every 24h (scannerReportTTL), so a finding's series
# briefly disappears while its image is rescanned. max_over_time over a day
# keeps the alert from resolving and firing again on every rescan; it also
# means an alert clears up to a day after the fix is deployed.
#
# The finding's severity is moved to vuln_severity: the alert's own severity
# label is what Alertmanager routes on. Aggregating drops the scrape labels
# (pod, instance), so an operator restart doesn't duplicate the alerts.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: trivy-operator
  namespace: trivy-operator
spec:
  groups:
    - name: trivy-operator
      rules:
        - alert: ImageVulnerabilities
          expr: |
            max by (namespace, name, resource_kind, resource_name, container_name, image_repository, image_tag, vuln_severity) (
              label_replace(
                max_over_time(trivy_image_vulnerabilities{severity=~"Critical|High"}[1d]),
                "vuln_severity", "$1", "severity", "(.*)"
              )
            ) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.image_repository }}:{{ $labels.image_tag }} has {{ $value }} {{ $labels.vuln_severity }} vulnerabilities"
            description: "Container `{{ $labels.container_name }}` of {{ $labels.resource_kind }} `{{ $labels.resource_name }}`. Details: `kubectl -n {{ $labels.namespace }} get vulnerabilityreports {{ $labels.name }} -o yaml`."
        - alert: ImageExposedSecrets
          expr: |
            max by (namespace, name, resource_kind, resource_name, container_name, image_repository, image_tag, vuln_severity) (
              label_replace(
                max_over_time(trivy_image_exposedsecrets{severity=~"Critical|High"}[1d]),
                "vuln_severity", "$1", "severity", "(.*)"
              )
            ) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.image_repository }}:{{ $labels.image_tag }} contains {{ $value }} {{ $labels.vuln_severity }} secrets"
            description: "Container `{{ $labels.container_name }}` of {{ $labels.resource_kind }} `{{ $labels.resource_name }}`. Details: `kubectl -n {{ $labels.namespace }} get exposedsecretreports {{ $labels.name }} -o yaml`."
