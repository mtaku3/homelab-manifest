global:
  hosts:
    domain: mtaku3.com

  ingress:
    enabled: false
    configureCertmanager: false

  hpa:
    apiVersion: autoscaling/v2

  # Unused. KAS is toggled here; gitlab.kas.enabled has no effect.
  kas:
    enabled: false

  pdb:
    apiVersion: policy/v1

  minio:
    replicas: 1

  # Daily logins go through Pocket ID and link to the existing mtaku3 user by
  # email; no new users are created from it. The admin is the local
  # admin.homelab (password in 1Password "GitLab 👑").
  appConfig:
    omniauth:
      enabled: true
      allowSingleSignOn: []
      blockAutoCreatedUsers: true
      autoLinkUser: [openid_connect]
      providers:
        - secret: gitlab-pocket-id-oidc
          key: provider

# This instance is kept as a read-only archive; nothing pushes to it or runs CI.
gitlab-runner:
  install: false

gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 2
    workerProcesses: 1
  sidekiq:
    # Pinned to one. Idle sidekiq already sits near the HPA's 350m target
    # (cron poller, metrics samplers), so it flapped 1<->2 and tripped
    # KubeHpaMaxedOut; a second pod only adds its own overhead and a Rails
    # boot. With min == max the alert skips this HPA.
    minReplicas: 1
    maxReplicas: 1
    concurrency: 5
    resources:
      requests:
        cpu: 100m
        memory: 1G
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 2
  gitlab-exporter:
    enabled: false
  mailroom:
    enabled: false

# Top-level subchart, so its HPA bounds live here rather than under gitlab:.
registry:
  hpa:
    minReplicas: 1
    maxReplicas: 2

prometheus:
  install: false

nginx-ingress:
  enabled: false

installCertmanager: false
