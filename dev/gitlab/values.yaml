global:
  hosts:
    domain: mtaku3.com

  ingress:
    enabled: false
    configureCertmanager: false

  hpa:
    apiVersion: autoscaling/v2

  # Unused. KAS is toggled here; gitlab.kas.enabled has no effect.
  kas:
    enabled: false

  pdb:
    apiVersion: policy/v1

  minio:
    replicas: 1

# This instance is kept as a read-only archive; nothing pushes to it or runs CI.
gitlab-runner:
  install: false

gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 2
    workerProcesses: 1
  sidekiq:
    minReplicas: 1
    maxReplicas: 2
    concurrency: 5
    resources:
      requests:
        cpu: 100m
        memory: 1G
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 2
  gitlab-exporter:
    enabled: false
  mailroom:
    enabled: false

# Top-level subchart, so its HPA bounds live here rather than under gitlab:.
registry:
  hpa:
    minReplicas: 1
    maxReplicas: 2

prometheus:
  install: false

nginx-ingress:
  enabled: false

installCertmanager: false
