helmCharts:
  - repo: http://charts.gitlab.io/
    name: gitlab
    version: "9.11.14"
    namespace: gitlab
    releaseName: gitlab
    valuesFile: values.yaml

resources:

# The gitlab chart emits an HPA for every enabled component with no toggle to
# turn it off (short of KEDA). This instance is a read-only archive on a single
# node, so nothing should autoscale: drop every HPA and pin each Deployment the
# chart leaves replica-less to 1. ArgoCD prunes the removed objects.
patches:
  - target:
      kind: HorizontalPodAutoscaler
    patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: unused
  - target:
      kind: Deployment
      name: gitlab-(webservice-default|gitlab-shell|sidekiq-all-in-1-v2|registry)
    patch: |
      - op: add
        path: /spec/replicas
        value: 1
