managementURL: https://netbird.mtaku3.com
cluster:
  name: homelab
# cert-manager is being retired; the chart then generates the webhook
# certificate itself (its churn is ignored in the Argo CD Application).
webhook:
  enableCertManager: false
# Only the API key secret in this namespace is needed.
clusterSecretsPermissions:
  allowAllSecrets: false
# The operator pins the routing peer to 0.72.4, which is affected by
# CVE-2026-105429 and CVE-2026-105428 (fixed in 0.74.7). Track the version
# edge1 runs (nix-config netbird-server versions.netbird).
routingClientImage: ghcr.io/netbirdio/netbird:0.81.4@sha256:0911a96049d95a37ee1653663a0d9005f77a0096a1dc0cac45d9c3a022256e85
