# Routing peer for the cluster. Resources (the Service CIDR, Services
# published through the NetBird reverse proxy) are added to its network
# from the NetBird dashboard, not via NetworkResource objects.
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: k8s
  annotations:
    # The CRD ships in the same sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  namespace: netbird
spec:
  # Required by the operator; stays empty since records are not managed here.
  dnsZoneRef:
    name: router.k8s.mtaku3.com
  workloadOverride:
    # Two routing peers so a restart never leaves the reverse proxy without
    # one: with a single router, the proxy kept no usable peer for domain
    # resources ("no current peer key") until it was restarted itself.
    replicas: 2
    podTemplate:
      spec:
        containers:
          - name: netbird
            env:
              # Since 0.74 `netbird up` hands the setup key to the daemon
              # through SetConfig, which this flag rejects, so the peer never
              # logs in. Operator 0.8.0 still sets it; main dropped it
              # (netbirdio/kubernetes-operator#376). Remove this once a release
              # includes that. Overriding an existing entry keeps the env order,
              # which avoids the merge bug in netbirdio/kubernetes-operator#398.
              - name: NB_DISABLE_UPDATE_SETTINGS
                value: "false"
