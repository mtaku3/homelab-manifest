apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo-web
  namespace: paseo
  labels:
    app: paseo-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paseo-web
  template:
    metadata:
      labels:
        app: paseo-web
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: extract-web-ui
          image: ghcr.io/getpaseo/paseo:0.7.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - >-
              cp -R
              /usr/local/lib/node_modules/@getpaseo/server/dist/server/web-ui/.
              /web/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 0
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
          volumeMounts:
            - name: web
              mountPath: /web
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29.1-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: web
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: paseo-web-nginx
        - name: tmp
          emptyDir: {}
