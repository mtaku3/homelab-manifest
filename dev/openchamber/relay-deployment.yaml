apiVersion: apps/v1
kind: Deployment
metadata:
  name: openchamber-relay
  namespace: openchamber
  labels:
    app: openchamber-relay
spec:
  # Rooms live in the memory of a single process, so the relay cannot be
  # scaled out or rolled without dropping every host and client anyway.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openchamber-relay
  template:
    metadata:
      labels:
        app: openchamber-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: ghcr.io/openchamber/openchamber-relay:sha-cef02c6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8788
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "20m"
              memory: "96Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
