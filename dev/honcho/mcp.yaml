# Honcho MCP server (upstream mcp/, Streamable HTTP host), built by
# mtaku3/honcho-mcp-image because upstream publishes no image. It holds no
# credential: every request carries its own `Authorization: Bearer <Honcho
# JWT>`, which is forwarded to the in-cluster API, so Honcho's own JWT scoping
# decides what a caller can reach. Requests without a bearer get 401 here.
# Published publicly through the NetBird reverse proxy for cloud MCP clients
# (Grok Bot), which cannot join NetBird.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-mcp
  namespace: honcho
  labels:
    app: honcho-mcp
spec:
  # MCP sessions live in process memory: run exactly one pod, and never two
  # at once during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: honcho-mcp
  template:
    metadata:
      labels:
        app: honcho-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/mtaku3/honcho-mcp:3326373c35f6538fb3b7af97803abe328c5aafb4@sha256:03e84bccf2b2bfd8e7b5f60c04d586f2ad700032d501229577405f0272d9347f
          imagePullPolicy: IfNotPresent
          env:
            - name: HONCHO_API_URL
              value: http://honcho-api.honcho.svc.cluster.local:8000
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: honcho-mcp
  namespace: honcho
spec:
  selector:
    app: honcho-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
