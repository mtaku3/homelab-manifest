# Cache only (CACHE_URL ends in ?suppress=true, so Honcho falls back to the
# database when Redis is away). Nothing here needs to survive a restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-redis
  namespace: honcho
  labels:
    app: honcho-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: honcho-redis
  template:
    metadata:
      labels:
        app: honcho-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.2.3@sha256:0908d9af26bf9b985e984a40a5eb82eed229b07a3317eee6843832c3cc3a9619
          imagePullPolicy: IfNotPresent
          args:
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: honcho-redis
  namespace: honcho
spec:
  selector:
    app: honcho-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
