name: Paseo relay image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/paseo-relay-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mtaku3/paseo-relay
  PASEO_RELAY_REF: 7e52c8c7c96f1b8049c39acb5208012c57eb0af0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/getpaseo/paseo-relay.git#${{ env.PASEO_RELAY_REF }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.PASEO_RELAY_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
